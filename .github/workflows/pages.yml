name: Validate numerical analysis site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Validate links, SVG and math presence
        run: python scripts/validate_site.py
      - name: Check deterministic numerical experiments
        run: python examples/reproduce.py
  browser:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install Chromium browser audit
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Inspect desktop/mobile pages, equations, demos
        run: python scripts/browser_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: qa/screenshots/
          if-no-files-found: ignore
