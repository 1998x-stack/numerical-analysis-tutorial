<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="t d"><title id="t">部分主元选择与行交换</title><desc id="d">当前列选取绝对值最大的候选元素作为主元，交换到对角位置，再用它消去下方元素。</desc><rect width="900" height="500" rx="16" fill="#f7faf8"/><text x="50" y="55" font-size="25" font-weight="700" fill="#173d43">先选主元，再做消去</text><g transform="translate(80 125)"><text x="0" y="0" font-size="19" fill="#173d43">当前列候选主元</text><g fill="#e4efea" stroke="#b7cbc4"><rect x="0" y="30" width="280" height="65" rx="8"/><rect x="0" y="105" width="280" height="65" rx="8"/><rect x="0" y="180" width="280" height="65" rx="8"/></g><g font-size="22" fill="#173d43"><text x="35" y="72">0.0000001</text><text x="35" y="147">0.8</text><text x="35" y="222">−0.2</text></g><rect x="15" y="115" width="110" height="45" rx="6" fill="#c8e5dc" stroke="#2b8177" stroke-width="3"/><text x="160" y="143" font-size="17" fill="#226c70">最大绝对值</text></g><path d="M410 245 H500 M485 230 L500 245 L485 260" stroke="#397d77" stroke-width="4" fill="none"/><g transform="translate(540 125)"><text x="0" y="0" font-size="19" fill="#173d43">交换后首个主元</text><rect x="0" y="30" width="280" height="65" rx="8" fill="#c8e5dc" stroke="#2b8177" stroke-width="3"/><rect x="0" y="105" width="280" height="65" rx="8" fill="#e4efea" stroke="#b7cbc4"/><rect x="0" y="180" width="280" height="65" rx="8" fill="#e4efea" stroke="#b7cbc4"/><g font-size="22" fill="#173d43"><text x="35" y="72">0.8</text><text x="35" y="147">0.0000001</text><text x="35" y="222">−0.2</text></g></g><text x="85" y="445" font-size="17" fill="#526c6a">部分主元使本步乘子 |mᵢₖ| ≤ 1；整体增长仍需另行监控。</text></svg>