<text x="121" y="137" font-size="13" fill="#ce7152">快模态 e⁻¹⁰⁰⁰ᵗ</text>
<text x="189" y="225" font-size="13" fill="#147f80">慢模态 e⁻ᵗ</text>
<text x="400" y="115" font-size="14" font-weight="bold" fill="#1f2d3a">两个时间尺度</text>
<text x="400" y="148" font-size="13" fill="#ce7152">快模态：τ ≈ 10⁻³，瞬间消失</text>
<text x="400" y="176" font-size="13" fill="#147f80">慢模态：τ ≈ 1，持续演化</text>
<text x="400" y="212" font-size="13" fill="#3a4a55">刚度比 S = 1000/1 = 10³</text>
<text x="400" y="240" font-size="13" fill="#3a4a55">显式方法被快模态的稳定性</text>
<text x="400" y="265" font-size="13" fill="#3a4a55">卡死，即使你只关心慢模态。</text>
<text x="80" y="322" font-size="12" fill="#7c8b93">教学示意：y₁'=−1000y₁, y₂'=−y₂</text>
