<title id="t27a">刚性系统的快模态与慢模态</title>
<desc id="t27a-d">快模态 e^(-1000t) 在 t≈0.001 就衰减到零，而慢模态 e^(-t) 在 t=1 仍有约 0.37；两个时间尺度相差三个数量级，这就是刚性</desc>
