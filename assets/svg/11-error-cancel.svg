<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="t d"><title id="t">Richardson 外推消去主导误差</title><desc id="d">粗网格误差主项为 c h 平方，细网格主项缩小四倍，通过四倍细网格近似减去粗网格近似消去该项。</desc><rect width="900" height="500" rx="16" fill="#f7faf8"/><text x="48" y="54" font-size="24" font-weight="700" fill="#173d43">误差主项的比例已知，未知系数可以被消去</text><rect x="70" y="100" width="310" height="112" rx="12" fill="#eaf1ed" stroke="#b5c9c2"/><text x="94" y="142" font-size="21" fill="#173d43">粗网格 T(h)</text><text x="94" y="180" font-size="19" fill="#a75e37">I + c h² + O(h⁴)</text><rect x="70" y="250" width="310" height="112" rx="12" fill="#eaf1ed" stroke="#b5c9c2"/><text x="94" y="292" font-size="21" fill="#173d43">细网格 T(h/2)</text><text x="94" y="330" font-size="19" fill="#a75e37">I + c h²/4 + O(h⁴)</text><path d="M410 155 H510 V306 H410" fill="none" stroke="#226c70" stroke-width="3"/><path d="M500 296 L510 306 L500 316" fill="none" stroke="#226c70" stroke-width="3"/><text x="428" y="133" font-size="17" fill="#226c70">组合</text><rect x="550" y="175" width="285" height="130" rx="14" fill="#dcefeb" stroke="#397d77" stroke-width="2"/><text x="580" y="220" font-size="21" font-weight="700" fill="#173d43">[4 T(h/2) − T(h)] / 3</text><text x="580" y="262" font-size="20" fill="#216a61">I + O(h⁴)</text><text x="580" y="288" font-size="15" fill="#496b67">二阶误差项严格抵消</text><text x="80" y="430" font-size="18" fill="#526c6a">这依赖误差展开存在且 h 已进入渐近区间，不是对任意函数的无条件保证。</text></svg>