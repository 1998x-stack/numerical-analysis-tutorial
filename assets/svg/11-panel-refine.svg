<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="t d"><title id="t">复合梯形网格逐次细分</title><desc id="d">同一积分区间由一个梯形细分为两个和四个梯形，新的采样点位于旧单元中点。</desc><rect width="900" height="500" rx="16" fill="#f7faf8"/><text x="55" y="52" font-size="24" font-weight="700" fill="#173d43">同一曲线，三种网格尺度</text><g stroke="#9bb5b0" stroke-width="2" fill="none"><path d="M100 205 H790 M100 375 H790"/></g><g fill="#e8b77d" fill-opacity=".35" stroke="#bb7445" stroke-width="2"><path d="M100 205 L790 205 L790 100 Q450 285 100 205Z" /></g><path d="M100 205 Q260 150 445 120 T790 100" fill="none" stroke="#226c70" stroke-width="4"/><g fill="#bb7445"><circle cx="100" cy="205" r="7"/><circle cx="790" cy="100" r="7"/></g><text x="110" y="240" font-size="17" fill="#3b575a">粗网格：1 段</text><path d="M100 375 Q260 320 445 290 T790 260" fill="none" stroke="#226c70" stroke-width="4"/><g stroke="#bb7445" stroke-width="2" fill="#f0c99d"><path d="M100 375 L445 290 L790 260 L790 375Z" fill-opacity=".2"/><path d="M100 375 L445 290 L790 260"/></g><g fill="#226c70"><circle cx="100" cy="375" r="6"/><circle cx="272.5" cy="329" r="6"/><circle cx="445" cy="290" r="6"/><circle cx="617.5" cy="275" r="6"/><circle cx="790" cy="260" r="6"/></g><g stroke="#bb7445" stroke-dasharray="5 5"><path d="M272.5 329 V405 M617.5 275 V405"/></g><text x="110" y="455" font-size="17" fill="#3b575a">细网格：新增点只出现在旧单元中点</text><text x="625" y="455" font-size="17" fill="#226c70">每次步长 h → h/2</text></svg>