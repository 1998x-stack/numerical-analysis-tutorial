<text x="260.0" y="180.0" font-size="13" fill="#ce7152" text-anchor="middle">b</text>
<rect x="280" y="155" width="40" height="40" fill="#f6f8f7" stroke="#dbe4e1"/>
<text x="300.0" y="180.0" font-size="13" fill="#7563ab" text-anchor="middle">c</text>
