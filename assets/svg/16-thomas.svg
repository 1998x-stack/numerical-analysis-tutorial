<path d="M170 127 V303" stroke="#147f80" stroke-width="3" marker-end="url(#ar)"/>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#147f80"/></marker></defs>
<text x="160" y="215.0" font-size="13" fill="#147f80" text-anchor="end">前向扫掠</text>
<path d="M424 303 V127" stroke="#c0392b" stroke-width="3" marker-end="url(#ar2)"/>
<defs><marker id="ar2" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#c0392b"/></marker></defs>
<text x="434" y="215.0" font-size="13" fill="#c0392b" text-anchor="start">反向回代</text>
<text x="34" y="308" font-size="13" fill="#607477">Thomas 算法 = 三对角结构上的 Gauss 消去，开销与 n 成正比。</text>
