<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t16b t16b-d" width="720" height="330" viewBox="0 0 720 330">
<title id="t16b">追赶法：前向消去与反向回代</title>
<desc id="t16b-d">三对角矩阵仅三条对角线非零，前向扫掠消去下次对角线，再自下而上回代。</desc>
<rect width="720" height="330" rx="12" fill="#fffdf9"/>
<g font-family="Arial,'PingFang SC',sans-serif">
<text x="34" y="42" font-size="20" font-weight="600" fill="#24424a">三对角结构：两条扫掠解完</text>
<text x="34" y="70" font-size="13" fill="#607477">a 为下次对角、b 为主对角、c 为上次对角；总运算量 O(n)。</text>
