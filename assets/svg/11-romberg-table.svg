<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="t d"><title id="t">Romberg 三角外推表</title><desc id="d">左侧第一列是逐次细分的梯形结果，向右使用 Richardson 递推，右下角为更高阶外推结果。</desc><rect width="900" height="500" rx="16" fill="#f7faf8"/><text x="50" y="55" font-size="25" font-weight="700" fill="#173d43">Romberg 表：沿行细分，沿列消去误差项</text><g font-size="18" text-anchor="middle"><g fill="#dce9e4" stroke="#b7cbc4"><rect x="90" y="112" width="170" height="64" rx="7"/><rect x="90" y="194" width="170" height="64" rx="7"/><rect x="280" y="194" width="170" height="64" rx="7"/><rect x="90" y="276" width="170" height="64" rx="7"/><rect x="280" y="276" width="170" height="64" rx="7"/><rect x="470" y="276" width="170" height="64" rx="7"/><rect x="90" y="358" width="170" height="64" rx="7"/><rect x="280" y="358" width="170" height="64" rx="7"/><rect x="470" y="358" width="170" height="64" rx="7"/><rect x="660" y="358" width="170" height="64" rx="7" fill="#c5e4db"/></g><g fill="#173d43"><text x="175" y="151">R₀,₀</text><text x="175" y="233">R₁,₀</text><text x="365" y="233">R₁,₁</text><text x="175" y="315">R₂,₀</text><text x="365" y="315">R₂,₁</text><text x="555" y="315">R₂,₂</text><text x="175" y="397">R₃,₀</text><text x="365" y="397">R₃,₁</text><text x="555" y="397">R₃,₂</text><text x="745" y="397">R₃,₃</text></g></g><g stroke="#397d77" stroke-width="3" fill="none"><path d="M260 226 H278 M450 308 H468 M640 390 H658"/><path d="M175 176 V192 M175 258 V274 M175 340 V356"/></g><text x="95" y="465" font-size="17" fill="#526c6a">每一列提高一个偶次误差阶；对角线是常用的高精度候选。</text></svg>