<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="06-boundary-conditions-title 06-boundary-conditions-desc" width="720" height="448" viewBox="0 0 720 448"><title id="06-boundary-conditions-title">三次样条的三种边界条件</title><desc id="06-boundary-conditions-desc">自然边界固定端点二阶导为零，给定一阶导数固定端点切线，not-a-knot匹配首尾内节点三阶导。</desc><rect x="0" y="0" width="720" height="448" fill="#fffdf9" rx="12"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif"><text x="34" y="42" font-size="23" fill="#24424a" text-anchor="700" font-weight="500">三种边界选择会改变整条样条</text><text x="34" y="77" font-size="15" fill="#607477" text-anchor="start" font-weight="500">内部 C² 条件不足以确定唯一答案，必须补充两个端点方程。</text><rect x="38" y="113" width="641" height="88" rx="9" fill="#f0f5f3" stroke="#147f80" stroke-width="1.6"/><text x="58" y="145" font-size="19" fill="#147f80" text-anchor="700" font-weight="500">natural</text><text x="335" y="145" font-size="17" fill="#24424a" text-anchor="600" font-weight="500">S″(a)=S″(b)=0</text><text x="335" y="175" font-size="14" fill="#607477" text-anchor="start" font-weight="500">自由端的弯曲约束</text><rect x="38" y="214" width="641" height="88" rx="9" fill="#fff" stroke="#ce7152" stroke-width="1.6"/><text x="58" y="246" font-size="19" fill="#ce7152" text-anchor="700" font-weight="500">指定一阶导数</text><text x="335" y="246" font-size="17" fill="#24424a" text-anchor="600" font-weight="500">S′(a)=α, S′(b)=β</text><text x="335" y="276" font-size="14" fill="#607477" text-anchor="start" font-weight="500">指定起止切线</text><rect x="38" y="315" width="641" height="88" rx="9" fill="#f0f5f3" stroke="#7563ab" stroke-width="1.6"/><text x="58" y="347" font-size="19" fill="#7563ab" text-anchor="700" font-weight="500">not-a-knot</text><text x="335" y="347" font-size="17" fill="#24424a" text-anchor="600" font-weight="500">首尾内节点三阶导匹配</text><text x="335" y="377" font-size="14" fill="#607477" text-anchor="start" font-weight="500">合并首尾两段的三次式</text></g></svg>