<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="t d"><title id="t">Gauss 求积区间映射</title><desc id="d">参考区间负一到正一经过仿射映射变成一般区间 a 到 b，积分权重乘以半区间长度。</desc><rect width="900" height="500" rx="16" fill="#f7faf8"/><text x="50" y="55" font-size="25" font-weight="700" fill="#173d43">把标准节点映射到实际积分区间</text><g font-size="20" fill="#173d43"><text x="105" y="150">参考区间 t ∈ [−1,1]</text><text x="575" y="150">实际区间 x ∈ [a,b]</text></g><path d="M110 230 H410 M570 230 H850" stroke="#789b94" stroke-width="4"/><g fill="#2b8278"><circle cx="200" cy="230" r="10"/><circle cx="320" cy="230" r="10"/></g><g fill="#c47a49"><circle cx="640" cy="230" r="10"/><circle cx="780" cy="230" r="10"/></g><g font-size="16" fill="#526c6a"><text x="110" y="265">−1</text><text x="390" y="265">1</text><text x="570" y="265">a</text><text x="840" y="265">b</text></g><path d="M420 230 H550 M535 215 L550 230 L535 245" fill="none" stroke="#397d77" stroke-width="3"/><rect x="190" y="330" width="520" height="105" rx="12" fill="#e3efeb" stroke="#b7cec5"/><text x="450" y="372" font-size="21" text-anchor="middle" fill="#173d43">x = (a+b)/2 + (b−a)t/2</text><text x="450" y="408" font-size="20" text-anchor="middle" fill="#226c70">dx = (b−a)dt/2</text></svg>