<text x="287" y="113" font-size="12" fill="#ce7152">向前 Euler</text>
<text x="233" y="203" font-size="12" fill="#c9a227">梯形法 → 1</text>
<text x="167" y="260" font-size="12" fill="#147f80">后向 Euler → 0</text>
<text x="400" y="112" font-size="14" font-weight="bold" fill="#1f2d3a">|R(z)| 沿负实轴</text>
<text x="400" y="146" font-size="13" fill="#ce7152">显式：越过 z=−2 后 |R|&gt;1，发散</text>
<text x="400" y="176" font-size="13" fill="#c9a227">梯形法：稳定但 → 1，强刚性下振荡</text>
<text x="400" y="206" font-size="13" fill="#147f80">后向 Euler：→ 0，L-稳定</text>
<text x="400" y="240" font-size="13" fill="#3a4a55">L-稳定 = A-稳定 + 无穷远快速衰减，</text>
<text x="400" y="265" font-size="13" fill="#3a4a55">是强刚性问题的优先性质。</text>
<text x="80" y="322" font-size="12" fill="#7c8b93">教学示意：z = hλ 取负实数</text>
