<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 446" width="720" height="446" role="img" aria-labelledby="04-divided-differences-title 04-divided-differences-desc"><title id="04-divided-differences-title">从三组节点得到的三角差商表</title><desc id="04-divided-differences-desc">从函数值1、2、5计算一阶差商1、3，再计算二阶差商1，得到Newton系数1、1、1。</desc><rect width="720" height="446" rx="18" fill="#fffdfa"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif"><text x="33" y="42" font-size="21" fill="#203b42" font-weight="700" text-anchor="start">差商表把节点信息累积成 Newton 系数</text><text x="33" y="73" font-size="14" fill="#607579" font-weight="500" text-anchor="start">示例 f(x)=x²+1，节点 0、1、2 的函数值分别为 1、2、5。</text><rect x="45" y="132" width="165" height="58" rx="10" fill="#f6f8f6" stroke="#203b42" stroke-width="1.5"/><text x="127" y="169" font-size="15" fill="#203b42" font-weight="700" text-anchor="middle">f[0] = 1</text><rect x="45" y="223" width="165" height="58" rx="10" fill="#f6f8f6" stroke="#203b42" stroke-width="1.5"/><text x="127" y="260" font-size="15" fill="#203b42" font-weight="700" text-anchor="middle">f[1] = 2</text><rect x="45" y="314" width="165" height="58" rx="10" fill="#f6f8f6" stroke="#203b42" stroke-width="1.5"/><text x="127" y="351" font-size="15" fill="#203b42" font-weight="700" text-anchor="middle">f[2] = 5</text><rect x="285" y="175" width="165" height="58" rx="10" fill="#eaf5f2" stroke="#167e7e" stroke-width="1.5"/><text x="367" y="212" font-size="15" fill="#167e7e" font-weight="700" text-anchor="middle">f[0,1] = 1</text><rect x="285" y="270" width="165" height="58" rx="10" fill="#eaf5f2" stroke="#167e7e" stroke-width="1.5"/><text x="367" y="307" font-size="15" fill="#167e7e" font-weight="700" text-anchor="middle">f[1,2] = 3</text><rect x="522" y="223" width="165" height="58" rx="10" fill="#fff0e6" stroke="#c46d52" stroke-width="1.5"/><text x="604" y="260" font-size="15" fill="#c46d52" font-weight="700" text-anchor="middle">f[0,1,2] = 1</text><path d="M211 161 L281 197" stroke="#167e7e" stroke-width="2.4" fill="none" /><path d="M 273.02248300785345 197.59935184992904 L 281 197 L 276.8472824538325 190.1622418160809" stroke="#167e7e" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M211 250 L281 197" stroke="#167e7e" stroke-width="2.4" fill="none" /><path d="M 278.0866549798177 204.45066579530842 L 281 197 L 273.03842980433393 197.78319858240533" stroke="#167e7e" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M211 250 L281 292" stroke="#167e7e" stroke-width="2.4" fill="none" /><path d="M 273.00036714109206 292.0766428253667 L 281 292 L 277.30309291230805 284.90543320667337" stroke="#167e7e" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M211 341 L281 292" stroke="#167e7e" stroke-width="2.4" fill="none" /><path d="M 277.8106091373997 299.33674218748087 L 281 292 L 273.01474603865813 292.4855091892787" stroke="#167e7e" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M452 204 L519 245" stroke="#c46d52" stroke-width="2.4" fill="none" /><path d="M 511.0000028702953 245.00677677775744 L 519 245 L 515.3651928163353 237.87341759764337" stroke="#c46d52" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M452 294 L519 245" stroke="#c46d52" stroke-width="2.4" fill="none" /><path d="M 515.963355931201 252.40126967482118 L 519 245 L 511.0265240202426 245.65090767412303" stroke="#c46d52" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="38" y="418" font-size="16" fill="#203b42" font-weight="650" text-anchor="start">Newton 系数 = 表格第一行各阶差商：1、1、1</text></g></svg>