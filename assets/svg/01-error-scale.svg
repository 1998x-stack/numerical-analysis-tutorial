<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 414" width="720" height="414" role="img" aria-labelledby="01-error-scale-title 01-error-scale-desc"><title id="01-error-scale-title">误差尺度的差异</title><desc id="01-error-scale-desc">相同的绝对误差0.01对数量100的相对误差是0.01%，对0.02的相对误差是50%。</desc><rect width="720" height="414" rx="18" fill="#fffdfa"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif"><text x="35" y="43" font-size="23" fill="#203b42" font-weight="700" text-anchor="start">绝对误差与相对误差回答不同问题</text><text x="35" y="76" font-size="15" fill="#607579" font-weight="500" text-anchor="start">同样偏离 0.01，对 100 与对 0.02 的影响不同</text><text x="37" y="136" font-size="18" fill="#203b42" font-weight="700" text-anchor="start">100 → 100.01</text><rect x="290" y="114" width="390" height="29" rx="4" fill="#eff3f2" stroke="#e0e9e5" stroke-width="1.5"/><rect x="290" y="114" width="8" height="29" rx="4" fill="#167e7e" stroke="#167e7e" stroke-width="1.5"/><text x="38" y="174" font-size="17" fill="#167e7e" font-weight="700" text-anchor="start">相对误差 = 0.01%</text><text x="37" y="258" font-size="18" fill="#203b42" font-weight="700" text-anchor="start">0.02 → 0.03</text><rect x="290" y="236" width="390" height="29" rx="4" fill="#eff3f2" stroke="#e0e9e5" stroke-width="1.5"/><rect x="290" y="236" width="380" height="29" rx="4" fill="#c46d52" stroke="#c46d52" stroke-width="1.5"/><text x="38" y="296" font-size="17" fill="#c46d52" font-weight="700" text-anchor="start">相对误差 = 50%</text><text x="35" y="385" font-size="14" fill="#607579" font-weight="500" text-anchor="start">当真值接近零时，相对误差可能很大甚至无定义；此时需用绝对误差或尺度化指标。</text></g></svg>