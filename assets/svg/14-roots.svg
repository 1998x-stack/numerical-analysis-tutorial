<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="t d"><title id="t">Legendre 三次多项式的三个零点</title><desc id="d">Legendre P3 在负一到正一之间穿过零轴三次，三个根是负根号三分之五、零、正根号三分之五。</desc><rect width="900" height="500" rx="16" fill="#f7faf8"/><text x="50" y="55" font-size="25" font-weight="700" fill="#173d43">正交多项式的零点落在正交区间内部</text><path d="M110 270 H820 M465 100 V420" stroke="#789b94" stroke-width="2"/><path d="M135 390 C170 345 190 270 210 270 C245 230 285 216 317 216 C370 216 420 270 465 270 C510 270 560 324 613 324 C650 324 690 300 720 270 C745 225 770 180 795 150" stroke="#2b8177" stroke-width="5" fill="none"/><g fill="#c47a49"><circle cx="210" cy="270" r="9"/><circle cx="465" cy="270" r="9"/><circle cx="720" cy="270" r="9"/></g><g font-size="17" fill="#526c6a" text-anchor="middle"><text x="210" y="305">−√(3/5)</text><text x="465" y="305">0</text><text x="720" y="305">+√(3/5)</text><text x="110" y="455">−1</text><text x="820" y="455">1</text></g><text x="520" y="120" font-size="18" fill="#173d43">P₃(x) = (5x³−3x)/2</text></svg>