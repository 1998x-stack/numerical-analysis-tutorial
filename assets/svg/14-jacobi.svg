<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="t d"><title id="t">Jacobi 矩阵生成 Gauss 节点与权重</title><desc id="d">正交多项式递推系数构造对称三对角矩阵，矩阵特征值成为 Gauss 节点，特征向量首分量平方乘总质量成为权重。</desc><rect width="900" height="500" rx="16" fill="#f7faf8"/><text x="50" y="55" font-size="25" font-weight="700" fill="#173d43">Golub–Welsch：多项式问题变成对称特征值问题</text><rect x="55" y="140" width="280" height="210" rx="12" fill="#e6efeb" stroke="#b5cbc2"/><text x="195" y="178" text-anchor="middle" font-size="19" fill="#173d43">Jacobi 三对角矩阵</text><g fill="#2b8177"><rect x="120" y="205" width="35" height="35" rx="4"/><rect x="165" y="205" width="35" height="35" rx="4"/><rect x="120" y="250" width="35" height="35" rx="4"/><rect x="165" y="250" width="35" height="35" rx="4"/><rect x="210" y="250" width="35" height="35" rx="4"/><rect x="165" y="295" width="35" height="35" rx="4"/><rect x="210" y="295" width="35" height="35" rx="4"/></g><g fill="#8aa9a0"><rect x="210" y="205" width="35" height="35" rx="4" opacity=".15"/><rect x="120" y="250" width="35" height="35" rx="4" opacity=".15"/><rect x="120" y="295" width="35" height="35" rx="4" opacity=".15"/><rect x="165" y="295" width="35" height="35" rx="4" opacity=".15"/></g><path d="M355 245 H465 M450 230 L465 245 L450 260" fill="none" stroke="#397d77" stroke-width="4"/><rect x="485" y="140" width="340" height="210" rx="12" fill="#e1eee9" stroke="#b5cbc2"/><text x="655" y="185" text-anchor="middle" font-size="20" fill="#173d43">对称特征分解</text><g fill="#2b8177"><circle cx="575" cy="245" r="13"/><circle cx="655" cy="245" r="13"/><circle cx="735" cy="245" r="13"/></g><g font-size="16" fill="#526c6a" text-anchor="middle"><text x="575" y="285">节点 x₁</text><text x="655" y="285">节点 x₂</text><text x="735" y="285">节点 x₃</text></g><text x="655" y="320" font-size="16" text-anchor="middle" fill="#226c70">wᵢ = μ₀ · (vᵢ,₁)²</text><text x="65" y="425" font-size="17" fill="#526c6a">只有主对角线与相邻副对角线非零；特征值给节点，首分量给权重。</text></svg>