<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="09-condition-squared-title 09-condition-squared-desc" width="720" height="406" viewBox="0 0 720 406"><title id="09-condition-squared-title">正规方程与QR或SVD在病态最小二乘问题上的区别</title><desc id="09-condition-squared-desc">列满秩时A转置乘A的二范数条件数为A的二范数条件数平方。</desc><rect x="0" y="0" width="720" height="406" fill="#fffdf9" rx="12"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif"><text x="35" y="42" font-size="22" fill="#24424a" text-anchor="700" font-weight="500">正规方程会把谱条件数平方</text><rect x="41" y="105" width="307" height="214" rx="9" fill="#f6f1eb" stroke="#ce7152" stroke-width="1.6"/><text x="60" y="149" font-size="19" fill="#ce7152" text-anchor="700" font-weight="500">直接使用 AᵀA</text><text x="60" y="190" font-size="20" fill="#24424a" text-anchor="700" font-weight="500">κ₂(AᵀA) = κ₂(A)²</text><text x="60" y="234" font-size="16" fill="#607477" text-anchor="start" font-weight="500">例如 κ(A)=10⁵</text><text x="60" y="271" font-size="18" fill="#ce7152" text-anchor="700" font-weight="500">κ(AᵀA)=10¹⁰</text><rect x="375" y="105" width="305" height="214" rx="9" fill="#ecf5f1" stroke="#147f80" stroke-width="1.6"/><text x="393" y="149" font-size="19" fill="#147f80" text-anchor="700" font-weight="500">QR / SVD 途径</text><text x="393" y="190" font-size="19" fill="#24424a" text-anchor="600" font-weight="500">避免显式形成 AᵀA</text><text x="393" y="234" font-size="16" fill="#607477" text-anchor="start" font-weight="500">列近相关时更可靠</text><text x="393" y="271" font-size="15" fill="#147f80" text-anchor="700" font-weight="500">但仍受问题病态性限制</text><text x="41" y="368" font-size="14" fill="#607477" text-anchor="start" font-weight="500">等式要求 A 列满秩；秩亏时 AᵀA 奇异，最小范数解需额外规则。</text></g></svg>