<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="t d"><title id="t">LU 分解与三角求解流程</title><desc id="d">矩阵 A 先经过行置换 P，再分解成 L 和 U，随后依次求解 Ly 等于 Pb 和 Ux 等于 y。</desc><rect width="900" height="500" rx="16" fill="#f7faf8"/><text x="50" y="55" font-size="25" font-weight="700" fill="#173d43">分解一次，复用因子求解多个右端项</text><g fill="#e4efea" stroke="#b7cbc4" stroke-width="2"><rect x="45" y="190" width="145" height="95" rx="12"/><rect x="255" y="190" width="145" height="95" rx="12"/><rect x="465" y="190" width="145" height="95" rx="12"/><rect x="675" y="115" width="180" height="80" rx="12" fill="#d5e9e1"/><rect x="675" y="280" width="180" height="80" rx="12" fill="#d5e9e1"/></g><g font-size="23" text-anchor="middle" fill="#173d43"><text x="117" y="247">A</text><text x="327" y="247">PA = LU</text><text x="537" y="247">L、U</text><text x="765" y="165">Ly = Pb</text><text x="765" y="330">Ux = y</text></g><g stroke="#397d77" stroke-width="3" fill="none"><path d="M190 238 H255 M240 223 L255 238 L240 253"/><path d="M400 238 H465 M450 223 L465 238 L450 253"/><path d="M610 220 L650 155 H675 M660 145 L675 155 L660 165"/><path d="M610 255 L650 320 H675 M660 310 L675 320 L660 330"/></g><text x="50" y="430" font-size="17" fill="#526c6a">前代和回代是 O(n²)；稠密分解主导成本约为 2n³/3。</text></svg>