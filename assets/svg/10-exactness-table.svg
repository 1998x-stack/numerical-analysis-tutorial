<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="10-exactness-table-title 10-exactness-table-desc" width="720" height="382" viewBox="0 0 720 382"><title id="10-exactness-table-title">梯形和Simpson代数精度的比较</title><desc id="10-exactness-table-desc">梯形规则对常数和一次多项式精确，Simpson规则对零到三次多项式精确。</desc><rect x="0" y="0" width="720" height="382" fill="#fffdf9" rx="12"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif"><text x="35" y="42" font-size="22" fill="#24424a" text-anchor="700" font-weight="500">代数精度：对哪些多项式严格积分正确？</text><text x="35" y="75" font-size="14" fill="#607477" text-anchor="start" font-weight="500">单段梯形规则精确到一次，单段 Simpson 精确到三次。</text><text x="95" y="134" font-size="18" fill="#24424a" text-anchor="middle" font-weight="700">x^0</text><rect x="60" y="158" width="70" height="47" rx="7" fill="#e0f2e8" stroke="#147f80" stroke-width="1.6"/><text x="95" y="187" font-size="15" fill="#147f80" text-anchor="middle" font-weight="700">精确</text><rect x="60" y="230" width="70" height="47" rx="7" fill="#e0f2e8" stroke="#147f80" stroke-width="1.6"/><text x="95" y="259" font-size="15" fill="#147f80" text-anchor="middle" font-weight="700">精确</text><text x="205" y="134" font-size="18" fill="#24424a" text-anchor="middle" font-weight="700">x^1</text><rect x="170" y="158" width="70" height="47" rx="7" fill="#e0f2e8" stroke="#147f80" stroke-width="1.6"/><text x="205" y="187" font-size="15" fill="#147f80" text-anchor="middle" font-weight="700">精确</text><rect x="170" y="230" width="70" height="47" rx="7" fill="#e0f2e8" stroke="#147f80" stroke-width="1.6"/><text x="205" y="259" font-size="15" fill="#147f80" text-anchor="middle" font-weight="700">精确</text><text x="315" y="134" font-size="18" fill="#24424a" text-anchor="middle" font-weight="700">x^2</text><rect x="280" y="158" width="70" height="47" rx="7" fill="#fae6df" stroke="#ce7152" stroke-width="1.6"/><text x="315" y="187" font-size="15" fill="#ce7152" text-anchor="middle" font-weight="700">误差</text><rect x="280" y="230" width="70" height="47" rx="7" fill="#e0f2e8" stroke="#147f80" stroke-width="1.6"/><text x="315" y="259" font-size="15" fill="#147f80" text-anchor="middle" font-weight="700">精确</text><text x="425" y="134" font-size="18" fill="#24424a" text-anchor="middle" font-weight="700">x^3</text><rect x="390" y="158" width="70" height="47" rx="7" fill="#fae6df" stroke="#ce7152" stroke-width="1.6"/><text x="425" y="187" font-size="15" fill="#ce7152" text-anchor="middle" font-weight="700">误差</text><rect x="390" y="230" width="70" height="47" rx="7" fill="#e0f2e8" stroke="#147f80" stroke-width="1.6"/><text x="425" y="259" font-size="15" fill="#147f80" text-anchor="middle" font-weight="700">精确</text><text x="535" y="134" font-size="18" fill="#24424a" text-anchor="middle" font-weight="700">x^4</text><rect x="500" y="158" width="70" height="47" rx="7" fill="#fae6df" stroke="#ce7152" stroke-width="1.6"/><text x="535" y="187" font-size="15" fill="#ce7152" text-anchor="middle" font-weight="700">误差</text><rect x="500" y="230" width="70" height="47" rx="7" fill="#fae6df" stroke="#ce7152" stroke-width="1.6"/><text x="535" y="259" font-size="15" fill="#ce7152" text-anchor="middle" font-weight="700">误差</text><text x="36" y="185" font-size="14" fill="#24424a" text-anchor="700" font-weight="500">梯形</text><text x="36" y="259" font-size="14" fill="#24424a" text-anchor="700" font-weight="500">Simpson</text><text x="41" y="344" font-size="14" fill="#607477" text-anchor="start" font-weight="500">注意：对于某些更高阶多项式可能偶然精确，但“代数精度”要求所有该次数以下均精确。</text></g></svg>