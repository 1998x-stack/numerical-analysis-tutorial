<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t16a t16a-d" width="720" height="320" viewBox="0 0 720 320">
<title id="t16a">Cholesky 把对称矩阵分解为 L 与 L 的转置</title>
<desc id="t16a-d">对称正定矩阵A等于单位下三角L乘其转置，只需存储半个矩阵。</desc>
<rect width="720" height="320" rx="12" fill="#fffdf9"/>
<g font-family="Arial,'PingFang SC',sans-serif">
<text x="34" y="42" font-size="20" font-weight="600" fill="#24424a">A = L · Lᵀ：利用对称性省一半</text>
<text x="34" y="70" font-size="13" fill="#607477">L 是下三角（对角为正）；Lᵀ 是其转置，无需额外存储。</text>
<rect x="90" y="120" width="54" height="54" fill="#fdf0ea" stroke="#ce7152" stroke-width="1.3"/><rect x="144" y="120" width="54" height="54" fill="#fdf0ea" stroke="#ce7152" stroke-width="1.3"/><rect x="198" y="120" width="54" height="54" fill="#fdf0ea" stroke="#ce7152" stroke-width="1.3"/><rect x="90" y="174" width="54" height="54" fill="#fdf0ea" stroke="#ce7152" stroke-width="1.3"/><rect x="144" y="174" width="54" height="54" fill="#fdf0ea" stroke="#ce7152" stroke-width="1.3"/><rect x="198" y="174" width="54" height="54" fill="#fdf0ea" stroke="#ce7152" stroke-width="1.3"/><rect x="90" y="228" width="54" height="54" fill="#fdf0ea" stroke="#ce7152" stroke-width="1.3"/><rect x="144" y="228" width="54" height="54" fill="#fdf0ea" stroke="#ce7152" stroke-width="1.3"/><rect x="198" y="228" width="54" height="54" fill="#fdf0ea" stroke="#ce7152" stroke-width="1.3"/>
<rect x="300" y="120" width="54" height="54" fill="#e9f3f1" stroke="#147f80" stroke-width="1.3"/><rect x="354" y="120" width="54" height="54" fill="#f6f8f7" stroke="#dbe4e1" stroke-width="1.3"/><rect x="408" y="120" width="54" height="54" fill="#f6f8f7" stroke="#dbe4e1" stroke-width="1.3"/><rect x="300" y="174" width="54" height="54" fill="#e9f3f1" stroke="#147f80" stroke-width="1.3"/><rect x="354" y="174" width="54" height="54" fill="#e9f3f1" stroke="#147f80" stroke-width="1.3"/><rect x="408" y="174" width="54" height="54" fill="#f6f8f7" stroke="#dbe4e1" stroke-width="1.3"/><rect x="300" y="228" width="54" height="54" fill="#e9f3f1" stroke="#147f80" stroke-width="1.3"/><rect x="354" y="228" width="54" height="54" fill="#e9f3f1" stroke="#147f80" stroke-width="1.3"/><rect x="408" y="228" width="54" height="54" fill="#e9f3f1" stroke="#147f80" stroke-width="1.3"/>
<rect x="510" y="120" width="54" height="54" fill="#e9f3f1" stroke="#147f80" stroke-width="1.3"/><rect x="564" y="120" width="54" height="54" fill="#e9f3f1" stroke="#147f80" stroke-width="1.3"/><rect x="618" y="120" width="54" height="54" fill="#e9f3f1" stroke="#147f80" stroke-width="1.3"/><rect x="510" y="174" width="54" height="54" fill="#f6f8f7" stroke="#dbe4e1" stroke-width="1.3"/><rect x="564" y="174" width="54" height="54" fill="#e9f3f1" stroke="#147f80" stroke-width="1.3"/><rect x="618" y="174" width="54" height="54" fill="#e9f3f1" stroke="#147f80" stroke-width="1.3"/><rect x="510" y="228" width="54" height="54" fill="#f6f8f7" stroke="#dbe4e1" stroke-width="1.3"/><rect x="564" y="228" width="54" height="54" fill="#f6f8f7" stroke="#dbe4e1" stroke-width="1.3"/><rect x="618" y="228" width="54" height="54" fill="#e9f3f1" stroke="#147f80" stroke-width="1.3"/>
<text x="171" y="110" font-size="14" fill="#24424a" text-anchor="middle">A（对称正定）</text>
<text x="381" y="110" font-size="14" fill="#24424a" text-anchor="middle">L（下三角）</text>
<text x="591" y="110" font-size="14" fill="#24424a" text-anchor="middle">Lᵀ（上三角）</text>
<text x="262" y="240" font-size="22" fill="#607477" text-anchor="middle">=</text>
<text x="472" y="240" font-size="22" fill="#607477" text-anchor="middle">×</text>
<text x="34" y="292" font-size="13" fill="#607477">运算量约 n³/3，是通用 LU（2n³/3）的一半；SPD 情形无需选主元。</text>
</g></svg>