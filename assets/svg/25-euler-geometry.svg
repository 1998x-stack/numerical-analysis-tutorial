<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t25a t25a-d" width="720" height="330" viewBox="0 0 720 330">
<title id="t25a">向前 Euler 单步的几何：切线近似曲线</title>
<desc id="t25a-d">从 y(0)=1 出发，切线斜率为 −1，Euler 一步到 (1,0)，而真实解 e⁻¹≈0.368，竖直差距就是局部截断误差</desc>
