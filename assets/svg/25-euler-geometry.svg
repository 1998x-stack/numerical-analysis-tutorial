<polyline points="70.0,82.4 370.0,312.4" fill="none" stroke="#ce7152" stroke-width="1.8" stroke-dasharray="6 4"/>
<line x1="312.3" y1="268.2" x2="312.3" y2="203.1" stroke="#8a5cc4" stroke-width="2"/>
<circle cx="81.5" cy="91.2" r="4.5" fill="#1f2d3a"/>
<circle cx="312.3" cy="268.2" r="4.5" fill="#ce7152"/>
<circle cx="312.3" cy="203.1" r="4.5" fill="#147f80"/>
<text x="87.5" y="85.2" font-size="13" fill="#1f2d3a">y₀=1</text>
<text x="242.3" y="286.2" font-size="13" fill="#ce7152">Euler 点 (h, 1−h)</text>
<text x="246.3" y="195.1" font-size="13" fill="#147f80">真实 e⁻ʰ</text>
<text x="320.3" y="236.3" font-size="12" fill="#8a5cc4">LTE=O(h²)</text>
<text x="400" y="115" font-size="14" font-weight="bold" fill="#1f2d3a">y' = −y, y(0)=1</text>
<text x="400" y="148" font-size="13" fill="#ce7152">虚线：切线 y = 1 − t</text>
<text x="400" y="176" font-size="13" fill="#147f80">青线：真实解 y = e⁻ᵗ</text>
<text x="400" y="212" font-size="13" fill="#3a4a55">Euler 沿切线走一步，丢弃了</text>
<text x="400" y="237" font-size="13" fill="#3a4a55">曲线的曲率，产生 O(h²) 局部误差。</text>
<text x="70" y="322" font-size="12" fill="#7c8b93">教学示意：h=1 时差距最大，便于观察</text>
</svg>