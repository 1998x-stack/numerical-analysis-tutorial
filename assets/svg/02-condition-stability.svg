<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 408" width="720" height="408" role="img" aria-labelledby="02-condition-stability-title 02-condition-stability-desc"><title id="02-condition-stability-title">条件数与算法稳定性的分工</title><desc id="02-condition-stability-desc">条件数刻画问题对输入扰动的敏感度；稳定性刻画计算算法是否人为增大扰动。后向稳定不保证病态问题的前向精度。</desc><rect width="720" height="408" rx="18" fill="#fffdfa"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif"><text x="35" y="44" font-size="23" fill="#203b42" font-weight="700" text-anchor="start">条件数描述问题，稳定性描述算法</text><rect x="35" y="99" width="310" height="165" rx="10" fill="#ecf5f1" stroke="#167e7e" stroke-width="1.5"/><text x="55" y="139" font-size="20" fill="#167e7e" font-weight="700" text-anchor="start">问题的条件数 κ</text><text x="55" y="175" font-size="16" fill="#203b42" font-weight="500" text-anchor="start">输入扰动 δx</text><path d="M155 185 L155 216" stroke="#167e7e" stroke-width="2.4" fill="none" /><path d="M 150.81850216855472 209.17980382352397 L 155 216 L 159.18149783144528 209.17980382352394" stroke="#167e7e" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="55" y="242" font-size="14" fill="#607579" font-weight="500" text-anchor="start">输出相对变化 ≈ κ · 输入相对变化</text><rect x="380" y="99" width="305" height="165" rx="10" fill="#f5f0eb" stroke="#c46d52" stroke-width="1.5"/><text x="400" y="139" font-size="20" fill="#c46d52" font-weight="700" text-anchor="start">算法的数值稳定性</text><text x="400" y="175" font-size="16" fill="#203b42" font-weight="500" text-anchor="start">有限精度算术</text><path d="M510 185 L510 216" stroke="#c46d52" stroke-width="2.4" fill="none" /><path d="M 505.81850216855474 209.17980382352397 L 510 216 L 514.1814978314453 209.17980382352394" stroke="#c46d52" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="400" y="242" font-size="14" fill="#607579" font-weight="500" text-anchor="start">是否引入额外的可控扰动？</text><rect x="35" y="301" width="650" height="78" rx="10" fill="#fff" stroke="#d8e3df" stroke-width="1.5"/><text x="57" y="331" font-size="18" fill="#203b42" font-weight="700" text-anchor="start">即使算法后向稳定，病态问题的前向误差仍可能很大。</text><text x="57" y="358" font-size="14" fill="#607579" font-weight="500" text-anchor="start">判断时必须同时考虑条件数、算法稳定性和精度。</text></g></svg>