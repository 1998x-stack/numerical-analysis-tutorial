<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="t d"><title id="t">小主元造成数值增长</title><desc id="d">不选主元时小的首主元产生极大乘子；部分主元通过行交换选择大主元，将消去乘子限制在单位以内。</desc><rect width="900" height="500" rx="16" fill="#f7faf8"/><text x="50" y="55" font-size="25" font-weight="700" fill="#173d43">算法中间量的增长，不等于问题本身病态</text><g><rect x="55" y="110" width="365" height="285" rx="14" fill="#f7e9df" stroke="#d6a889"/><rect x="480" y="110" width="365" height="285" rx="14" fill="#e1eee9" stroke="#9fbeb3"/></g><g font-size="20" text-anchor="middle"><text x="238" y="155" fill="#7d442d">不选主元</text><text x="662" y="155" fill="#22665d">部分主元</text></g><g font-size="18" fill="#173d43" text-anchor="middle"><text x="238" y="220">首主元 = 10⁻²⁰</text><text x="238" y="270">乘子 = 10²⁰</text><text x="238" y="330" fill="#a45535">中间量巨大</text><text x="662" y="220">交换行，首主元 = 1</text><text x="662" y="270">乘子 = 10⁻²⁰</text><text x="662" y="330" fill="#22665d">中间量受控</text></g><text x="65" y="450" font-size="17" fill="#526c6a">条件数描述问题对扰动的敏感性；主元策略描述算法如何控制舍入误差传播。</text></svg>