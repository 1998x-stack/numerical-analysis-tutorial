<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="08-projection-geometry-title 08-projection-geometry-desc" width="720" height="440" viewBox="0 0 720 440"><title id="08-projection-geometry-title">函数空间中的正交投影几何</title><desc id="08-projection-geometry-desc">最佳平方逼近是函数在有限维子空间上的正交投影，残差与所有基方向正交。</desc><rect x="0" y="0" width="720" height="440" fill="#fffdf9" rx="12"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif"><text x="35" y="43" font-size="23" fill="#24424a" text-anchor="700" font-weight="500">平方逼近 = 把函数投影到低维子空间</text><text x="35" y="76" font-size="15" fill="#607477" text-anchor="start" font-weight="500">正交残差不会被子空间内的任何方向再次消除。</text><polygon points="87,312 574,312 660,254 172,254" fill="#ebf4f1" stroke="#147f80" stroke-width="2"/><text x="570" y="332" font-size="16" fill="#147f80" text-anchor="700" font-weight="500">V = span{1,x}</text><circle cx="285" cy="289" r="7" fill="#24424a" stroke="white" stroke-width="1.6"/><text x="276" y="317" font-size="16" fill="#24424a" text-anchor="700" font-weight="500">p*</text><path d="M285 289 L407 140" stroke="#ce7152" stroke-width="2.3" fill="none" /><path d="M405.7789237161725 148.91678040040654 L407 140 L398.49942421279724 142.9563848338845" fill="none" stroke="#ce7152" stroke-width="2.3" stroke-linejoin="round"/><circle cx="407" cy="140" r="7" fill="#ce7152" stroke="white" stroke-width="1.6"/><text x="419" y="132" font-size="20" fill="#ce7152" text-anchor="700" font-weight="500">f</text><text x="351" y="213" font-size="17" fill="#ce7152" text-anchor="700" font-weight="500">残差 r=f−p*</text><path d="M285 289 L414 289" stroke="#7563ab" stroke-width="2" fill="none" stroke-dasharray="5 5"/><text x="382" y="308" font-size="14" fill="#7563ab" text-anchor="start" font-weight="500">基方向</text><text x="36" y="403" font-size="18" fill="#24424a" text-anchor="700" font-weight="500">⟨f−p*, v⟩=0（对每个 v∈V）</text></g></svg>