<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="t d"><title id="t">正交多项式三项递推</title><desc id="d">前两阶多项式与 x 和递推系数通过一次组合生成下一阶多项式。</desc><rect width="900" height="500" rx="16" fill="#f7faf8"/><text x="50" y="55" font-size="25" font-weight="700" fill="#173d43">只连接相邻两阶：递推比展开更有结构</text><g fill="#e1eee9" stroke="#9cbdb3" stroke-width="2"><rect x="75" y="170" width="190" height="90" rx="12"/><rect x="75" y="310" width="190" height="90" rx="12"/><rect x="365" y="240" width="160" height="90" rx="12"/><rect x="645" y="240" width="190" height="90" rx="12" fill="#cbe7df"/></g><g fill="#173d43" font-size="23" text-anchor="middle"><text x="170" y="225">pₖ₋₁(x)</text><text x="170" y="365">pₖ(x)</text><text x="445" y="295">线性组合</text><text x="740" y="295">pₖ₊₁(x)</text></g><g stroke="#397d77" stroke-width="3" fill="none"><path d="M265 215 H315 L365 265"/><path d="M265 355 H315 L365 305"/><path d="M525 285 H645"/><path d="M630 273 L645 285 L630 297"/></g><text x="385" y="175" font-size="17" fill="#526c6a">乘以 x，再减去 αₖ、βₖ 项</text><text x="85" y="455" font-size="17" fill="#526c6a">系数来自带权内积与相邻多项式的平方范数。</text></svg>