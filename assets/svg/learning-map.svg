<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 735 486" width="735" height="486" role="img" aria-labelledby="learning-map-title learning-map-desc"><title id="learning-map-title">数值分析的学习概念图</title><desc id="learning-map-desc">输入经过有限精度计算后通向插值、微积分、线性代数、动力系统四条路线；每条都需要验证误差和稳定性。</desc><rect width="735" height="486" rx="18" fill="#fffdfa"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif"><text x="35" y="42" font-size="22" fill="#203b42" font-weight="700" text-anchor="start">从数学模型到可验证的数值答案</text><text x="35" y="72" font-size="14" fill="#607579" font-weight="500" text-anchor="start">把抽象对象变成离散算法，理解每一步的误差与代价</text><rect x="205" y="105" width="310" height="75" rx="10" fill="#ebf4f0" stroke="#167e7e" stroke-width="1.5"/><text x="360" y="140" font-size="21" fill="#203b42" font-weight="700" text-anchor="middle">数学问题与输入数据</text><text x="360" y="164" font-size="13" fill="#607579" font-weight="400" text-anchor="middle">真实问题 → 计算模型</text><path d="M360 180 L360 217" stroke="#167e7e" stroke-width="2.4" fill="none" /><path d="M 355.81850216855474 210.17980382352397 L 360 217 L 364.18149783144526 210.17980382352394" stroke="#167e7e" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="240" y="218" width="240" height="63" rx="10" fill="#f0ecf7" stroke="#7667ac" stroke-width="1.5"/><text x="360" y="255" font-size="20" fill="#7667ac" font-weight="700" text-anchor="middle">有限精度计算</text><path d="M360 281 L97 331" stroke="#167e7e" stroke-width="2.4" fill="none" /><path d="M 102.91921395642437 325.6182803735171 L 97 331 L 104.48116063343086 333.83411989457124" stroke="#167e7e" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="26" y="331" width="151" height="93" rx="10" fill="#fff" stroke="#167e7e" stroke-width="1.5"/><text x="101" y="365" font-size="16" fill="#167e7e" font-weight="700" text-anchor="middle">插值与逼近</text><text x="101" y="397" font-size="12" fill="#607579" font-weight="400" text-anchor="middle">用样本构造函数</text><path d="M360 281 L274 331" stroke="#c46d52" stroke-width="2.4" fill="none" /><path d="M 277.79440225660795 323.9570949520068 L 274 331 L 281.99781496171124 331.1869648047844" stroke="#c46d52" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="203" y="331" width="151" height="93" rx="10" fill="#fff" stroke="#c46d52" stroke-width="1.5"/><text x="278" y="365" font-size="16" fill="#c46d52" font-weight="700" text-anchor="middle">数值微积分</text><text x="278" y="397" font-size="12" fill="#607579" font-weight="400" text-anchor="middle">近似连续算子</text><path d="M360 281 L451 331" stroke="#7667ac" stroke-width="2.4" fill="none" /><path d="M 443.00905323414696 331.3804862485068 L 451 331 L 447.0362453954193 324.05099651499114" stroke="#7667ac" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="380" y="331" width="151" height="93" rx="10" fill="#fff" stroke="#7667ac" stroke-width="1.5"/><text x="455" y="365" font-size="16" fill="#7667ac" font-weight="700" text-anchor="middle">线性与特征值</text><text x="455" y="397" font-size="12" fill="#607579" font-weight="400" text-anchor="middle">求解矩阵方程</text><path d="M360 281 L628 331" stroke="#b4873d" stroke-width="2.4" fill="none" /><path d="M 620.5285912168716 333.85972914720816 L 628 331 L 622.0623862906139 325.6385875519496" stroke="#b4873d" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="557" y="331" width="151" height="93" rx="10" fill="#fff" stroke="#b4873d" stroke-width="1.5"/><text x="632" y="365" font-size="16" fill="#b4873d" font-weight="700" text-anchor="middle">动力学</text><text x="632" y="397" font-size="12" fill="#607579" font-weight="400" text-anchor="middle">推进状态随时间</text><text x="35" y="461" font-size="14" fill="#607579" font-weight="550" text-anchor="start">共同标准：误差界 · 收敛性 · 稳定性 · 可复现</text></g></svg>