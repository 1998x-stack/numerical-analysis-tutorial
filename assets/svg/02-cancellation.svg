<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 387" width="720" height="387" role="img" aria-labelledby="02-cancellation-title 02-cancellation-desc"><title id="02-cancellation-title">灾难性消去的有效位数损失</title><desc id="02-cancellation-desc">两个大小接近的近似浮点数相减，绝对误差可能不大，但结果的相对误差会剧增。</desc><rect width="720" height="387" rx="18" fill="#fffdfa"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif"><text x="36" y="44" font-size="23" fill="#203b42" font-weight="700" text-anchor="start">灾难性消去：相近的近似数相减</text><text x="36" y="77" font-size="15" fill="#607579" font-weight="500" text-anchor="start">存入浮点格式的有效位数有限；减法放大输入中的相对误差。</text><rect x="40" y="118" width="283" height="84" rx="10" fill="#edf6f2" stroke="#167e7e" stroke-width="1.5"/><text x="58" y="151" font-size="26" fill="#167e7e" font-weight="700" text-anchor="start">1.234567</text><text x="58" y="181" font-size="26" fill="#c46d52" font-weight="700" text-anchor="start">1.234566</text><path d="M323 160 L391 160" stroke="#167e7e" stroke-width="2.4" fill="none" /><path d="M 384.17980382352397 164.18149783144528 L 391 160 L 384.17980382352397 155.81850216855472" stroke="#167e7e" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="392" y="118" width="280" height="84" rx="10" fill="#fff1e9" stroke="#c46d52" stroke-width="1.5"/><text x="417" y="153" font-size="27" fill="#c46d52" font-weight="700" text-anchor="start">0.000001</text><text x="417" y="182" font-size="13" fill="#607579" font-weight="500" text-anchor="start">结果只留下少量有效数字</text><rect x="40" y="241" width="632" height="115" rx="10" fill="#fff" stroke="#d9e3e0" stroke-width="1.5"/><text x="59" y="275" font-size="16" fill="#203b42" font-weight="700" text-anchor="start">关键：减法本身可能正确舍入，但输入相对误差被放大。</text><text x="59" y="310" font-size="15" fill="#607579" font-weight="500" text-anchor="start">例如 (1 − cos x) 在 x 很小时容易发生消去；</text><text x="59" y="335" font-size="15" fill="#167e7e" font-weight="650" text-anchor="start">可使用 2 sin²(x/2) 避免两次相近数直接相减。</text></g></svg>