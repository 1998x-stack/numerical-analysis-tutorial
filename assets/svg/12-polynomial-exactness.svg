<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="t d"><title id="t">Gauss 二点规则的多项式精确度</title><desc id="d">二点 Gauss 规则对零次到三次多项式精确，但对四次多项式一般不精确。</desc><rect width="900" height="500" rx="16" fill="#f7faf8"/><text x="48" y="55" font-size="25" font-weight="700" fill="#173d43">n 个 Gauss 节点的代数精度是 2n−1</text><g transform="translate(65 105)"><rect width="770" height="275" rx="14" fill="#edf4f0" stroke="#c6d6cf"/><g font-size="18" fill="#173d43"><text x="35" y="50">二点规则：两个节点 → 对 0、1、2、3 次多项式精确</text><text x="35" y="102">三点规则：三个节点 → 对 0 至 5 次多项式精确</text></g><g transform="translate(40 145)" font-size="16"><g fill="#2d8177"><rect x="0" y="0" width="115" height="52" rx="7"/><rect x="128" y="0" width="115" height="52" rx="7"/><rect x="256" y="0" width="115" height="52" rx="7"/><rect x="384" y="0" width="115" height="52" rx="7"/></g><g fill="#fff" text-anchor="middle"><text x="57" y="32">常数</text><text x="185" y="32">一次</text><text x="313" y="32">二次</text><text x="441" y="32">三次</text></g><rect x="512" y="0" width="150" height="52" rx="7" fill="#e8b58a"/><text x="587" y="32" fill="#5a3827" text-anchor="middle">四次：不保证</text></g></g><text x="70" y="440" font-size="17" fill="#526c6a">精确性针对整个多项式空间；对单个函数碰巧精确不能提高代数精度。</text></svg>