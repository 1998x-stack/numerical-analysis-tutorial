<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="06-continuity-title 06-continuity-desc" width="720" height="448" viewBox="0 0 720 448"><title id="06-continuity-title">三次样条节点上的连续性条件</title><desc id="06-continuity-desc">各区间三次多项式在公共节点处的值、一阶导和二阶导连续。</desc><rect x="0" y="0" width="720" height="448" fill="#fffdf9" rx="12"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif"><text x="34" y="42" font-size="23" fill="#24424a" text-anchor="start" font-weight="700">为什么分段三次样条仍然是 C² 连续？</text><text x="34" y="75" font-size="15" fill="#607477" text-anchor="start" font-weight="500">每个区间可有不同三次式；节点处必须匹配值、斜率与曲率。</text><rect x="44" y="120" width="196" height="114" rx="9" fill="#ebf4f1" stroke="#147f80" stroke-width="1.6"/><text x="142" y="158" font-size="18" fill="#24424a" text-anchor="middle" font-weight="700">区间 1：S0(x)</text><text x="142" y="189" font-size="15" fill="#607477" text-anchor="middle" font-weight="500">4 个局部系数</text><path d="M242 176 L262 176" stroke="#147f80" stroke-width="2.3" fill="none" /><path d="M254.32727930146444 180.70418506037592 L262 176 L254.32727930146444 171.29581493962408" fill="none" stroke="#147f80" stroke-width="2.3" stroke-linejoin="round"/><rect x="264" y="120" width="196" height="114" rx="9" fill="#f8f1ed" stroke="#ce7152" stroke-width="1.6"/><text x="362" y="158" font-size="18" fill="#24424a" text-anchor="middle" font-weight="700">区间 2：S1(x)</text><text x="362" y="189" font-size="15" fill="#607477" text-anchor="middle" font-weight="500">4 个局部系数</text><path d="M462 176 L482 176" stroke="#147f80" stroke-width="2.3" fill="none" /><path d="M474.32727930146444 180.70418506037592 L482 176 L474.32727930146444 171.29581493962408" fill="none" stroke="#147f80" stroke-width="2.3" stroke-linejoin="round"/><rect x="484" y="120" width="196" height="114" rx="9" fill="#ebf4f1" stroke="#147f80" stroke-width="1.6"/><text x="582" y="158" font-size="18" fill="#24424a" text-anchor="middle" font-weight="700">区间 3：S2(x)</text><text x="582" y="189" font-size="15" fill="#607477" text-anchor="middle" font-weight="500">4 个局部系数</text><path d="M68 309 L661 309" stroke="#24424a" stroke-width="2" fill="none" /><circle cx="74" cy="309" r="7" fill="#147f80" stroke="white" stroke-width="1.6"/><text x="74" y="334" font-size="14" fill="#147f80" text-anchor="middle" font-weight="700">x0</text><circle cx="274" cy="309" r="7" fill="#147f80" stroke="white" stroke-width="1.6"/><text x="274" y="334" font-size="14" fill="#147f80" text-anchor="middle" font-weight="700">x1</text><circle cx="474" cy="309" r="7" fill="#147f80" stroke="white" stroke-width="1.6"/><text x="474" y="334" font-size="14" fill="#147f80" text-anchor="middle" font-weight="700">x2</text><circle cx="654" cy="309" r="7" fill="#147f80" stroke="white" stroke-width="1.6"/><text x="654" y="334" font-size="14" fill="#147f80" text-anchor="middle" font-weight="700">x3</text><text x="57" y="377" font-size="17" fill="#24424a" text-anchor="700" font-weight="500">在所有内节点：</text><text x="238" y="377" font-size="17" fill="#147f80" text-anchor="700" font-weight="500">S 左 = S 右</text><text x="238" y="411" font-size="17" fill="#147f80" text-anchor="700" font-weight="500">S′ 左 = S′ 右</text><text x="472" y="377" font-size="17" fill="#ce7152" text-anchor="700" font-weight="500">S″ 左 = S″ 右</text></g></svg>