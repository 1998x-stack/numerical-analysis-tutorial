<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="09-residual-orthogonality-title 09-residual-orthogonality-desc" width="720" height="382" viewBox="0 0 720 382"><title id="09-residual-orthogonality-title">三点线性回归残差的正交性</title><desc id="09-residual-orthogonality-desc">最小二乘线性拟合残差是0.5、-1、0.5，对常数列和x列求内积均为零。</desc><rect x="0" y="0" width="720" height="382" fill="#fffdf9" rx="12"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif"><text x="33" y="42" font-size="23" fill="#24424a" text-anchor="700" font-weight="500">残差对设计矩阵的列正交</text><rect x="44" y="96" width="633" height="202" rx="9" fill="#f8fbfa" stroke="#dfe8e4" stroke-width="1.6"/><text x="94" y="133" font-size="17" fill="#24424a" text-anchor="700" font-weight="500">x0=-1</text><text x="94" y="173" font-size="16" fill="#607477" text-anchor="start" font-weight="500">y0=1</text><text x="94" y="214" font-size="16" fill="#147f80" text-anchor="start" font-weight="500">p0=0.5</text><text x="94" y="256" font-size="17" fill="#ce7152" text-anchor="700" font-weight="500">r0=0.5</text><text x="282" y="133" font-size="17" fill="#24424a" text-anchor="700" font-weight="500">x1=0</text><text x="282" y="173" font-size="16" fill="#607477" text-anchor="start" font-weight="500">y1=0</text><text x="282" y="214" font-size="16" fill="#147f80" text-anchor="start" font-weight="500">p1=1</text><text x="282" y="256" font-size="17" fill="#ce7152" text-anchor="700" font-weight="500">r1=-1</text><text x="470" y="133" font-size="17" fill="#24424a" text-anchor="700" font-weight="500">x2=1</text><text x="470" y="173" font-size="16" fill="#607477" text-anchor="start" font-weight="500">y2=2</text><text x="470" y="214" font-size="16" fill="#147f80" text-anchor="start" font-weight="500">p2=1.5</text><text x="470" y="256" font-size="17" fill="#ce7152" text-anchor="700" font-weight="500">r2=0.5</text><text x="46" y="339" font-size="19" fill="#147f80" text-anchor="700" font-weight="500">Σrᵢ = 0</text><text x="256" y="339" font-size="19" fill="#147f80" text-anchor="700" font-weight="500">Σxᵢrᵢ = 0</text><text x="472" y="339" font-size="19" fill="#ce7152" text-anchor="700" font-weight="500">Σrᵢ² = 1.5</text></g></svg>