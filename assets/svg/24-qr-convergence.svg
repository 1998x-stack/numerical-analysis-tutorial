<text x="400" y="110" font-size="14" font-weight="bold" fill="#1f2d3a">底部次对角元 |A[n-1,n-2]|（对数）</text>
<text x="400" y="148" font-size="13" fill="#ce7152">■ 基本 QR（σ=0）：线性收敛，约十几步</text>
<text x="400" y="178" font-size="13" fill="#147f80">■ Wilkinson 平移 QR：约 3 步到 1e-16（三次）</text>
<text x="400" y="218" font-size="13" fill="#3a4a55">两类迭代都对 A 做正交相似变换，</text>
<text x="400" y="243" font-size="13" fill="#3a4a55">特征值不变；平移只改变收敛速度。</text>
<text x="70" y="332" font-size="12" fill="#7c8b93">教学示意：对称三对角矩阵，对角 1..5、次对角 1</text>
</svg>