<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t24b t24b-d" width="720" height="340" viewBox="0 0 720 340">
<title id="t24b">带平移与不带平移的 QR 迭代收敛对比</title>
<desc id="t24b-d">对数坐标下，不带平移的 QR 迭代线性收敛、约十几步；带 Wilkinson 平移的 QR 只需约 3 步就把最底部次对角元降到 1e-16</desc>
<rect width="720" height="340" rx="12" fill="#fffdf9"/>
