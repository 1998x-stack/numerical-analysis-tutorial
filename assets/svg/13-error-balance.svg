<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="t d"><title id="t">数值微分步长误差平衡</title><desc id="d">截断误差随步长变小而下降，舍入误差随步长变小而上升，总误差在最优步长附近达到最低。</desc><rect width="900" height="500" rx="16" fill="#f7faf8"/><text x="50" y="55" font-size="25" font-weight="700" fill="#173d43">总误差不是单调函数</text><path d="M110 390 V115 M110 390 H820" stroke="#789b94" stroke-width="3"/><text x="55" y="115" font-size="15" fill="#526c6a">误差</text><text x="790" y="430" font-size="15" fill="#526c6a">步长 h →</text><path d="M135 155 C270 245 420 330 760 365" fill="none" stroke="#2b8177" stroke-width="5"/><path d="M135 365 C420 360 600 255 760 145" fill="none" stroke="#c47a49" stroke-width="5"/><path d="M135 360 C260 300 360 150 485 145 C600 145 700 290 760 360" fill="none" stroke="#173d43" stroke-width="5"/><path d="M485 145 V390" stroke="#173d43" stroke-dasharray="6 6" stroke-width="2"/><circle cx="485" cy="145" r="8" fill="#173d43"/><g font-size="17"><text x="600" y="365" fill="#2b8177">截断误差</text><text x="600" y="120" fill="#c47a49">舍入误差</text><text x="330" y="190" fill="#173d43">总误差</text><text x="505" y="170" fill="#173d43">最优步长附近</text></g></svg>