<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t22b t22b-d" width="720" height="340" viewBox="0 0 720 340">
<title id="t22b">牛顿法与 Broyden 法的误差下降对比</title>
<desc id="t22b-d">对数坐标下，牛顿法误差每步约平方下降，Broyden 法每步约按黄金比 1.618 的超线性速率下降，达到 1e-12 需要更多步</desc>
<rect width="720" height="340" rx="12" fill="#fffdf9"/>
<rect x="70" y="60" width="300" height="240" rx="6" fill="#f5faf8" stroke="#d3e2de"/>
<line x1="70" y1="74" x2="370" y2="74" stroke="#e3ebe8" stroke-width="1"/><text x="372" y="78" font-size="11" fill="#7c8b93">1e0</text><line x1="70" y1="131" x2="370" y2="131" stroke="#e3ebe8" stroke-width="1"/><text x="372" y="135" font-size="11" fill="#7c8b93">1e-4</text><line x1="70" y1="187" x2="370" y2="187" stroke="#e3ebe8" stroke-width="1"/><text x="372" y="191" font-size="11" fill="#7c8b93">1e-8</text><line x1="70" y1="244" x2="370" y2="244" stroke="#e3ebe8" stroke-width="1"/><text x="372" y="248" font-size="11" fill="#7c8b93">1e-12</text><line x1="70" y1="300" x2="370" y2="300" stroke="#e3ebe8" stroke-width="1"/><text x="372" y="304" font-size="11" fill="#7c8b93">1e-16</text>
<line x1="70" y1="300" x2="370" y2="300" stroke="#9fb1ad" stroke-width="1.4"/>
<text x="66" y="315" font-size="12" fill="#3a4a55">0</text><text x="99" y="315" font-size="12" fill="#3a4a55">1</text><text x="133" y="315" font-size="12" fill="#3a4a55">2</text><text x="166" y="315" font-size="12" fill="#3a4a55">3</text><text x="199" y="315" font-size="12" fill="#3a4a55">4</text><text x="233" y="315" font-size="12" fill="#3a4a55">5</text><text x="266" y="315" font-size="12" fill="#3a4a55">6</text><text x="299" y="315" font-size="12" fill="#3a4a55">7</text><text x="333" y="315" font-size="12" fill="#3a4a55">8</text>
<polyline points="70.0,78.7 103.3,92.4 136.7,119.2 170.0,172.1 203.3,277.7 236.7,295.1 270.0,295.1 303.3,295.1 336.7,295.1" fill="none" stroke="#147f80" stroke-width="2.4"/>
<polyline points="70.0,78.7 103.3,92.4 136.7,102.1 170.0,115.5 203.3,142.8 236.7,181.7 270.0,223.6 303.3,266.4 336.7,300.0" fill="none" stroke="#ce7152" stroke-width="2.4"/>
<circle cx="336.7" cy="295.1" r="4" fill="#147f80"/>
<circle cx="336.7" cy="300.0" r="4" fill="#ce7152"/>
<text x="430" y="110" font-size="14" font-weight="bold" fill="#1f2d3a">误差 |x_k − x*|（对数）</text>
<text x="430" y="145" font-size="13" fill="#147f80">■ 牛顿法：阶 p=2（每步位数翻倍）</text>
<text x="430" y="175" font-size="13" fill="#ce7152">■ Broyden：超线性 p≈1.618</text>
<text x="430" y="215" font-size="13" fill="#3a4a55">牛顿法 4 步达到 1e-12；</text>
<text x="430" y="240" font-size="13" fill="#3a4a55">Broyden 7 步，且每步只需</text>
<text x="430" y="265" font-size="13" fill="#3a4a55">一次函数求值 + O(n²) 更新。</text>
<text x="70" y="332" font-size="12" fill="#7c8b93">教学示意：同一方程组 F(x)=0，初始 H=J(x₀)⁻¹</text>
</svg>