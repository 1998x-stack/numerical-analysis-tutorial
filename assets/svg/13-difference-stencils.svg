<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="t d"><title id="t">数值微分的三种差分模板</title><desc id="d">前向模板取 x 和 x 加 h，后向模板取 x 减 h 和 x，中心模板对称取 x 减 h 和 x 加 h。</desc><rect width="900" height="500" rx="16" fill="#f7faf8"/><text x="50" y="55" font-size="25" font-weight="700" fill="#173d43">差分模板：可用点集决定边界与精度</text><g font-size="18" fill="#173d43"><text x="80" y="135">前向差分</text><text x="360" y="135">后向差分</text><text x="640" y="135">中心差分</text></g><g stroke="#789b94" stroke-width="3"><path d="M70 220 H300 M350 220 H580 M630 220 H860"/></g><g fill="#c47a49"><circle cx="115" cy="220" r="10"/><circle cx="250" cy="220" r="10"/><circle cx="395" cy="220" r="10"/><circle cx="530" cy="220" r="10"/></g><g fill="#2b8278"><circle cx="710" cy="220" r="10"/><circle cx="845" cy="220" r="10"/></g><g font-size="15" fill="#526c6a" text-anchor="middle"><text x="115" y="255">x</text><text x="250" y="255">x+h</text><text x="395" y="255">x−h</text><text x="530" y="255">x</text><text x="710" y="255">x−h</text><text x="845" y="255">x+h</text></g><g fill="#e3efeb" stroke="#b7cec5"><rect x="70" y="310" width="230" height="90" rx="10"/><rect x="350" y="310" width="230" height="90" rx="10"/><rect x="630" y="310" width="230" height="90" rx="10"/></g><g font-size="18" fill="#173d43" text-anchor="middle"><text x="185" y="347">O(h)</text><text x="465" y="347">O(h)</text><text x="745" y="347">O(h²)</text></g><g font-size="15" fill="#526c6a" text-anchor="middle"><text x="185" y="378">单侧采样</text><text x="465" y="378">单侧采样</text><text x="745" y="378">对称抵消偶次项</text></g></svg>