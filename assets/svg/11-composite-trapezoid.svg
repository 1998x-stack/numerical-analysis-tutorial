<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t11a t11a-d" width="720" height="420" viewBox="0 0 720 420">
<title id="t11a">复合梯形：把区间切段后逐段用弦近似</title>
<desc id="t11a-d">在零到一的区间上，用四条端点连线（弦）近似正弦曲线，每段的面积是可算的梯形。</desc>
<rect width="720" height="420" rx="12" fill="#fffdf9"/>
<g font-family="Arial,'PingFang SC',sans-serif">
<text x="34" y="46" font-size="20" font-weight="600" fill="#24424a">复合梯形：n=4 段弦近似曲线</text>
<text x="34" y="76" font-size="14" fill="#607477">每段梯形面积可精确计算；段数翻倍，误差约降为 1/4。</text>
<rect x="90" y="120" width="550" height="220" fill="#fff" stroke="#e3e9e7"/>
<path d="M90 340 H640" stroke="#9fb1ad"/>
<polygon points="90.0,340.0 227.5,210.4 227.5,340 90.0,340" fill="#ce7152" fill-opacity="0.10" stroke="#ce7152" stroke-width="1.6"/>
<polygon points="227.5,210.4 365.0,156.7 365.0,340 227.5,340" fill="#ce7152" fill-opacity="0.10" stroke="#ce7152" stroke-width="1.6"/>
<polygon points="365.0,156.7 502.5,210.4 502.5,340 365.0,340" fill="#ce7152" fill-opacity="0.10" stroke="#ce7152" stroke-width="1.6"/>
<polygon points="502.5,210.4 640.0,340.0 640.0,340 502.5,340" fill="#ce7152" fill-opacity="0.10" stroke="#ce7152" stroke-width="1.6"/>
