<path d="M227.5 210.4 V340" stroke="#dfe8e4" stroke-width="1"/>
<path d="M365.0 156.7 V340" stroke="#dfe8e4" stroke-width="1"/>
<path d="M502.5 210.4 V340" stroke="#dfe8e4" stroke-width="1"/>
<path d="M640.0 340.0 V340" stroke="#dfe8e4" stroke-width="1"/>
