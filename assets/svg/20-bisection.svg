<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t20a t20a-d" width="720" height="310" viewBox="0 0 720 310">
<title id="t20a">二分法：异号区间逐次减半</title>
<desc id="t20a-d">连续函数在区间两端异号时根被夹在区间内；每步取中点并保留含根的一半，区间长度按二的负幂收缩，误差上界为(b-a)除以二的n次方。</desc>
<rect width="720" height="310" rx="12" fill="#fffdf9"/>
<defs><marker id="a20a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#ce7152"/></marker></defs>
<g font-family="Arial,'PingFang SC',sans-serif">
<text x="30" y="34" font-size="19" font-weight="600" fill="#24424a">f(x)=cos x − x 在 [0,1] 上的括根与减半</text>
<text x="30" y="56" font-size="13" fill="#607477">f(0)&gt;0、f(1)&lt;0，故根存在；每步只保留仍异号的一半。</text>
<line x1="70" y1="70" x2="70" y2="260" stroke="#cfdedb" stroke-width="1.5"/>
<line x1="70" y1="260" x2="660" y2="260" stroke="#24424a" stroke-width="1.5"/>
<text x="70" y="278" font-size="13" fill="#607477" text-anchor="middle">0</text>
<text x="650" y="278" font-size="13" fill="#607477" text-anchor="middle">1</text>
<line x1="499" y1="70" x2="499" y2="260" stroke="#ce7152" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="503" y="80" font-size="13" fill="#ce7152">x* ≈ 0.7391</text>
<g stroke="#147f80" stroke-width="2">
<line x1="70" y1="95" x2="650" y2="95"/><rect x="70" y="91" width="580" height="8" fill="#dcebea" stroke="none"/><line x1="70" y1="88" x2="70" y2="102"/><line x1="650" y1="88" x2="650" y2="102"/>
<line x1="360" y1="130" x2="650" y2="130"/><rect x="360" y="126" width="290" height="8" fill="#dcebea" stroke="none"/><line x1="360" y1="123" x2="360" y2="137"/><line x1="650" y1="123" x2="650" y2="137"/>
<line x1="360" y1="165" x2="505" y2="165"/><rect x="360" y="161" width="145" height="8" fill="#dcebea" stroke="none"/><line x1="360" y1="158" x2="360" y2="172"/><line x1="505" y1="158" x2="505" y2="172"/>
<line x1="432" y1="200" x2="505" y2="200"/><rect x="432" y="196" width="73" height="8" fill="#dcebea" stroke="none"/><line x1="432" y1="193" x2="432" y2="207"/><line x1="505" y1="193" x2="505" y2="207"/>
<line x1="469" y1="235" x2="505" y2="235"/><rect x="469" y="231" width="36" height="8" fill="#dcebea" stroke="none"/><line x1="469" y1="228" x2="469" y2="242"/><line x1="505" y1="228" x2="505" y2="242"/>
</g>
<text x="30" y="99" font-size="13" fill="#147f80">k=0</text><text x="30" y="134" font-size="13" fill="#147f80">k=1</text><text x="30" y="169" font-size="13" fill="#147f80">k=2</text><text x="30" y="204" font-size="13" fill="#147f80">k=3</text><text x="30" y="239" font-size="13" fill="#147f80">k=4</text>
<text x="30" y="300" font-size="13" fill="#607477">误差上界 |x_k − x*| ≤ (b−a)/2ⁿ；要达到 ε 需 n ≥ log₂((b−a)/ε) 步（连续 + 端点异号即保证收敛）。</text>
</g></svg>
