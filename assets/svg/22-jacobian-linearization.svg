<circle cx="183.1" cy="160.0" r="4.5" fill="#ce7152"/>
<circle cx="166.7" cy="165.1" r="5" fill="#147f80"/>
<text x="329.8" y="202.0" font-size="13" fill="#1f2d3a">x₀=(2, 1)</text>
<text x="179.1" y="180.0" font-size="13" fill="#ce7152">x₁=(1.625, 1.25)</text>
<text x="136.7" y="155.1" font-size="13" fill="#147f80">根 x*</text>
<text x="180" y="330" font-size="13" fill="#3a4a55">f₁=0（圆，青）· f₂=0（双曲线，紫）· 线性化直线（虚线）</text>
<text x="420" y="110" font-size="14" fill="#1f2d3a" font-weight="bold">线性化求解</text>
<text x="420" y="140" font-size="13" fill="#3a4a55">J(x₀)·s = −F(x₀)</text>
<text x="420" y="168" font-size="13" fill="#3a4a55">F(x₀)=(1, 2)</text>
<text x="420" y="196" font-size="13" fill="#3a4a55">J=[[4, 2], [4, −2]]</text>
<text x="420" y="224" font-size="13" fill="#3a4a55">s=(−0.375, 0.25)</text>
<text x="420" y="252" font-size="13" fill="#3a4a55">x₁=x₀+s=(1.625, 1.25)</text>
<text x="420" y="286" font-size="13" fill="#147f80">两条偏移切线相交 ⇒ 牛顿步</text>
</svg>