<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t22a t22a-d" width="720" height="360" viewBox="0 0 720 360">
<title id="t22a">非线性方程组牛顿步的线性化几何</title>
<desc id="t22a-d">两条零水平集曲线在根处相交；在当前点把每个分量线性化，得到两条平行于切线的偏移直线，交点给出牛顿步 x₁=(1.625, 1.25)</desc>
<rect width="720" height="360" rx="12" fill="#fffdf9"/>
<rect x="80" y="60" width="300" height="240" rx="6" fill="#f5faf8" stroke="#d3e2de"/>
<line x1="80" y1="300" x2="380" y2="300" stroke="#9fb1ad" stroke-width="1.4"/>
<line x1="80" y1="60" x2="80" y2="300" stroke="#9fb1ad" stroke-width="1.4"/>
<polyline points="80.0,114.9 88.1,118.9 96.2,123.0 104.4,127.3 112.5,131.7 120.6,136.3 128.7,141.0 136.9,145.8 145.0,150.8 153.1,156.0 161.2,161.4 169.4,166.9 177.5,172.7 185.6,178.7 193.8,184.9 201.9,191.4 210.0,198.2 218.1,205.3 226.2,212.8 234.4,220.6 242.5,228.9 250.6,237.7 258.8,247.1 266.9,257.2 275.0,268.1 283.1,280.1 291.2,293.5 299.4,308.9 307.5,327.2 315.6,351.3 323.8,410.0" fill="none" stroke="#147f80" stroke-width="2.2"/>
<polyline points="98.7,214.0 106.2,208.4 113.7,202.8 121.2,197.2 128.7,191.8 136.2,186.4 143.8,181.1 151.2,175.8 158.8,170.5 166.2,165.3 173.7,160.2 181.2,155.1 188.7,150.0 196.2,145.0 203.7,140.0 211.2,135.0 218.8,130.1 226.2,125.2 233.8,120.3 241.3,115.5 248.8,110.7 256.2,105.9 263.8,101.1 271.2,96.3 278.8,91.6 286.2,86.9 293.8,82.2 301.2,77.5 308.8,72.9 316.2,68.2 323.8,63.6" fill="none" stroke="#8a5cc4" stroke-width="2.2"/>
<polyline points="80.0,50.0 342.5,330.0" fill="none" stroke="#ce7152" stroke-width="1.8" stroke-dasharray="6 4"/>
<polyline points="80.0,270.0 342.5,-10.0" fill="none" stroke="#c9a227" stroke-width="1.8" stroke-dasharray="6 4"/>
