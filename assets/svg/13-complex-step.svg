<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="t d"><title id="t">复数步长微分路径</title><desc id="d">在复平面中从实轴上的 x 沿纯虚方向移动到 x 加 i h，解析函数输出的虚部除以 h 给出导数近似。</desc><rect width="900" height="500" rx="16" fill="#f7faf8"/><text x="50" y="55" font-size="25" font-weight="700" fill="#173d43">用虚部承载微小扰动</text><path d="M120 360 H770 M280 430 V100" stroke="#789b94" stroke-width="3"/><text x="780" y="366" font-size="17" fill="#526c6a">Re(z)</text><text x="290" y="90" font-size="17" fill="#526c6a">Im(z)</text><circle cx="520" cy="360" r="9" fill="#c47a49"/><circle cx="520" cy="210" r="9" fill="#2b8177"/><path d="M520 350 V220 M510 235 L520 215 L530 235" stroke="#2b8177" stroke-width="4" fill="none"/><path d="M520 360 H720" stroke="#c47a49" stroke-dasharray="7 6" stroke-width="2"/><text x="535" y="390" font-size="19" fill="#c47a49">x</text><text x="540" y="205" font-size="19" fill="#2b8177">x + ih</text><rect x="115" y="115" width="270" height="95" rx="12" fill="#e3efeb" stroke="#b7cec5"/><text x="250" y="155" text-anchor="middle" font-size="19" fill="#173d43">Im f(x+ih)</text><text x="250" y="185" text-anchor="middle" font-size="17" fill="#226c70">除以 h 估计 f′(x)</text><path d="M390 160 H450 L500 205" stroke="#397d77" stroke-width="3" fill="none"/><text x="115" y="465" font-size="16" fill="#526c6a">前提：f 在目标点附近解析，代码必须保留复数输入的虚部。</text></svg>