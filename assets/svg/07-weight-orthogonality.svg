<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="07-weight-orthogonality-title 07-weight-orthogonality-desc" width="720" height="405" viewBox="0 0 720 405"><title id="07-weight-orthogonality-title">Legendre与Chebyshev的权函数不同</title><desc id="07-weight-orthogonality-desc">Legendre权为1，Chebyshev第一类权为1除以根号1减x平方，在端点奇异但可积。</desc><rect x="0" y="0" width="720" height="405" fill="#fffdf9" rx="12"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif"><text x="34" y="42" font-size="23" fill="#24424a" text-anchor="700" font-weight="500">正交性必须连同权函数一起指定</text><rect x="43" y="106" width="305" height="124" rx="9" fill="#edf5f2" stroke="#147f80" stroke-width="1.6"/><text x="58" y="146" font-size="20" fill="#147f80" text-anchor="700" font-weight="500">Legendre 权重</text><text x="58" y="181" font-size="18" fill="#24424a" text-anchor="start" font-weight="500">w(x)=1</text><text x="58" y="210" font-size="14" fill="#607477" text-anchor="start" font-weight="500">在 [−1,1] 上有限</text><rect x="374" y="106" width="305" height="124" rx="9" fill="#f4effa" stroke="#7563ab" stroke-width="1.6"/><text x="389" y="146" font-size="20" fill="#7563ab" text-anchor="700" font-weight="500">Chebyshev 权重</text><text x="389" y="181" font-size="18" fill="#24424a" text-anchor="start" font-weight="500">w(x)=1/√(1−x²)</text><text x="389" y="210" font-size="14" fill="#607477" text-anchor="start" font-weight="500">端点处发散，但可积</text><rect x="42" y="267" width="639" height="102" rx="9" fill="#fff" stroke="#dfe8e4" stroke-width="1.6"/><text x="61" y="304" font-size="17" fill="#ce7152" text-anchor="700" font-weight="500">错误：直接在 −1 与 1 采样 1/√(1−x²)</text><text x="61" y="339" font-size="16" fill="#147f80" text-anchor="700" font-weight="500">正确：变量代换 x=cos θ，内积变为 0 到 π 的 θ 积分。</text></g></svg>