<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t12b t12b-d" width="720" height="340" viewBox="0 0 720 340">
<title id="t12b">相同节点数下的代数精度对比</title>
<desc id="t12b-d">横轴是节点数 m，Gauss 求积精确到 2m-1 次多项式，闭合 Newton-Cotes 只到约 m 次。</desc>
<rect width="720" height="340" rx="12" fill="#fffdf9"/>
<g font-family="Arial,'PingFang SC',sans-serif">
<text x="34" y="44" font-size="20" font-weight="600" fill="#24424a">代数精度：Gauss 对比 Newton–Cotes</text>
<text x="34" y="72" font-size="14" fill="#607477">横轴为节点数 m；Gauss 达到 2m−1，Newton–Cotes 约为 m。</text>
<path d="M110 280 H660" stroke="#9fb1ad" stroke-width="1.4"/>
<rect x="130" y="257.8" width="30" height="22.2" rx="3" fill="#147f80"/><text x="145" y="249.8" font-size="13" font-weight="600" fill="#147f80" text-anchor="middle">1</text>
<rect x="164" y="257.8" width="30" height="22.2" rx="3" fill="#ce7152"/><text x="179" y="249.8" font-size="13" font-weight="600" fill="#ce7152" text-anchor="middle">1</text>
<text x="162" y="300" font-size="13" fill="#607477" text-anchor="middle">m=1</text>
<rect x="235" y="213.3" width="30" height="66.7" rx="3" fill="#147f80"/><text x="250" y="205.3" font-size="13" font-weight="600" fill="#147f80" text-anchor="middle">3</text>
<rect x="269" y="257.8" width="30" height="22.2" rx="3" fill="#ce7152"/><text x="284" y="249.8" font-size="13" font-weight="600" fill="#ce7152" text-anchor="middle">1</text>
<text x="267" y="300" font-size="13" fill="#607477" text-anchor="middle">m=2</text>
<rect x="340" y="168.9" width="30" height="111.1" rx="3" fill="#147f80"/><text x="355" y="160.9" font-size="13" font-weight="600" fill="#147f80" text-anchor="middle">5</text>
<rect x="374" y="213.3" width="30" height="66.7" rx="3" fill="#ce7152"/><text x="389" y="205.3" font-size="13" font-weight="600" fill="#ce7152" text-anchor="middle">3</text>
<text x="372" y="300" font-size="13" fill="#607477" text-anchor="middle">m=3</text>
<rect x="445" y="124.4" width="30" height="155.6" rx="3" fill="#147f80"/><text x="460" y="116.4" font-size="13" font-weight="600" fill="#147f80" text-anchor="middle">7</text>
<rect x="479" y="213.3" width="30" height="66.7" rx="3" fill="#ce7152"/><text x="494" y="205.3" font-size="13" font-weight="600" fill="#ce7152" text-anchor="middle">3</text>
<text x="477" y="300" font-size="13" fill="#607477" text-anchor="middle">m=4</text>
<rect x="550" y="80.0" width="30" height="200.0" rx="3" fill="#147f80"/><text x="565" y="72.0" font-size="13" font-weight="600" fill="#147f80" text-anchor="middle">9</text>
<rect x="584" y="168.9" width="30" height="111.1" rx="3" fill="#ce7152"/><text x="599" y="160.9" font-size="13" font-weight="600" fill="#ce7152" text-anchor="middle">5</text>
<text x="582" y="300" font-size="13" fill="#607477" text-anchor="middle">m=5</text>
<rect x="130" y="318" width="14" height="14" fill="#147f80"/><text x="150" y="330" font-size="13" fill="#24424a">Gauss (2m−1)</text>
<rect x="330" y="318" width="14" height="14" fill="#ce7152"/><text x="350" y="330" font-size="13" fill="#24424a">Newton–Cotes (闭合，约 m)</text>
</g></svg>