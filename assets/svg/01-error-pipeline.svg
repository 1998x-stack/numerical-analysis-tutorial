<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="01-error-pipeline-title 01-error-pipeline-desc"><title id="01-error-pipeline-title">从真实量到计算结果的误差来源</title><desc id="01-error-pipeline-desc">流程展示真实量、建模、离散化、浮点计算和验证。舍入误差并不等于全部误差。</desc><rect width="720" height="400" rx="18" fill="#fffdfa"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif"><text x="35" y="43" font-size="23" fill="#203b42" font-weight="700" text-anchor="start">四种误差不是同一件事</text><rect x="28" y="108" width="129" height="100" rx="10" fill="#fff" stroke="#203b42" stroke-width="1.5"/><text x="92" y="149" font-size="16" fill="#203b42" font-weight="700" text-anchor="middle">真实物理量</text><text x="92" y="181" font-size="13" fill="#607579" font-weight="400" text-anchor="middle">观测与建模</text><path d="M158 157 L170 157" stroke="#607579" stroke-width="2.4" fill="none" /><path d="M 163.17980382352397 161.18149783144528 L 170 157 L 163.17980382352397 152.81850216855472" stroke="#607579" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="173" y="108" width="129" height="100" rx="10" fill="#f5f8f7" stroke="#7667ac" stroke-width="1.5"/><text x="237" y="149" font-size="16" fill="#7667ac" font-weight="700" text-anchor="middle">数学问题</text><text x="237" y="181" font-size="13" fill="#607579" font-weight="400" text-anchor="middle">模型近似</text><path d="M303 157 L315 157" stroke="#607579" stroke-width="2.4" fill="none" /><path d="M 308.17980382352397 161.18149783144528 L 315 157 L 308.17980382352397 152.81850216855472" stroke="#607579" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="318" y="108" width="129" height="100" rx="10" fill="#fff" stroke="#167e7e" stroke-width="1.5"/><text x="382" y="149" font-size="16" fill="#167e7e" font-weight="700" text-anchor="middle">离散算法</text><text x="382" y="181" font-size="13" fill="#607579" font-weight="400" text-anchor="middle">截断误差</text><path d="M448 157 L460 157" stroke="#607579" stroke-width="2.4" fill="none" /><path d="M 453.17980382352397 161.18149783144528 L 460 157 L 453.17980382352397 152.81850216855472" stroke="#607579" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="463" y="108" width="129" height="100" rx="10" fill="#f5f8f7" stroke="#c46d52" stroke-width="1.5"/><text x="527" y="149" font-size="16" fill="#c46d52" font-weight="700" text-anchor="middle">机器运算</text><text x="527" y="181" font-size="13" fill="#607579" font-weight="400" text-anchor="middle">舍入误差</text><path d="M593 157 L605 157" stroke="#607579" stroke-width="2.4" fill="none" /><path d="M 598.1798038235239 161.18149783144528 L 605 157 L 598.1798038235239 152.81850216855472" stroke="#607579" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="608" y="108" width="129" height="100" rx="10" fill="#fff" stroke="#b4873d" stroke-width="1.5"/><text x="672" y="149" font-size="16" fill="#b4873d" font-weight="700" text-anchor="middle">最终结果</text><text x="672" y="181" font-size="13" fill="#607579" font-weight="400" text-anchor="middle">需要验证</text><rect x="35" y="258" width="655" height="111" rx="10" fill="#ebf4f0" stroke="#d9e5e1" stroke-width="1.5"/><text x="55" y="292" font-size="18" fill="#203b42" font-weight="700" text-anchor="start">算法的总体误差 ≠ 只有一次四则运算的舍入误差</text><text x="55" y="326" font-size="15" fill="#607579" font-weight="500" text-anchor="start">必须同时分清：模型误差、数据误差、离散化误差、计算舍入误差。</text><text x="55" y="352" font-size="14" fill="#607579" font-weight="500" text-anchor="start">对于固定模型，离散化与舍入常会随步长呈相反变化趋势。</text></g></svg>