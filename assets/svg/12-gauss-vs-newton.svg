<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="t d"><title id="t">等距节点与 Gauss 节点对比</title><desc id="d">Newton Cotes 的三个等距节点位于负一、零、正一；二点 Gauss 节点位于负和正一除以根号三。</desc><rect width="900" height="500" rx="16" fill="#f7faf8"/><text x="50" y="55" font-size="25" font-weight="700" fill="#173d43">节点位置也是可优化的自由度</text><g font-size="20" fill="#173d43"><text x="80" y="145">三点 Simpson / Newton–Cotes</text><text x="80" y="190" font-size="17" fill="#526c6a">固定端点与中点</text></g><path d="M160 230 H780" stroke="#789b94" stroke-width="3"/><g fill="#c47a49"><circle cx="160" cy="230" r="12"/><circle cx="470" cy="230" r="12"/><circle cx="780" cy="230" r="12"/></g><g font-size="16" fill="#526c6a" text-anchor="middle"><text x="160" y="265">−1</text><text x="470" y="265">0</text><text x="780" y="265">1</text></g><text x="80" y="340" font-size="20" fill="#173d43">二点 Gauss–Legendre</text><text x="80" y="385" font-size="17" fill="#526c6a">内部节点，权重由正交性决定</text><path d="M160 420 H780" stroke="#789b94" stroke-width="3"/><g fill="#2b8278"><circle cx="291" cy="420" r="12"/><circle cx="649" cy="420" r="12"/></g><g font-size="16" fill="#526c6a" text-anchor="middle"><text x="291" y="455">−1/√3</text><text x="649" y="455">+1/√3</text></g></svg>