<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t18a t18a-d" width="720" height="300" viewBox="0 0 720 300">
<title id="t18a">矩阵分裂与迭代格式</title>
<desc id="t18a-d">把A拆成容易求逆的M和剩余N，迭代x更新为Gx加c，G等于M逆N。</desc>
<rect width="720" height="300" rx="12" fill="#fffdf9"/>
<g font-family="Arial,'PingFang SC',sans-serif">
<text x="34" y="42" font-size="20" font-weight="600" fill="#24424a">矩阵分裂：A = M − N</text>
<text x="34" y="70" font-size="13" fill="#607477">M 选成对角/三角等易求逆的部分，迭代矩阵 G = M⁻¹N。</text>
<rect x="80" y="120" width="140" height="70" rx="8" fill="#fff" stroke="#24424a" stroke-width="2"/><text x="150.0" y="161.0" font-size="16" fill="#24424a" text-anchor="middle">A x = b</text>
<rect x="290" y="100" width="300" height="110" rx="8" fill="#fff" stroke="#147f80" stroke-width="2"/><text x="440.0" y="161.0" font-size="18" fill="#147f80" text-anchor="middle">A = M − N</text>
<rect x="300" y="120" width="130" height="40" rx="8" fill="#fff" stroke="#147f80" stroke-width="2"/><text x="365.0" y="146.0" font-size="14" fill="#147f80" text-anchor="middle">M（易求逆）</text>
<rect x="450" y="120" width="130" height="40" rx="8" fill="#fff" stroke="#ce7152" stroke-width="2"/><text x="515.0" y="146.0" font-size="14" fill="#ce7152" text-anchor="middle">N（剩余）</text>
<path d="M220 155 H285" stroke="#9fb1ad" stroke-width="2" marker-end="url(#a18)"/>
<defs><marker id="a18" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#9fb1ad"/></marker></defs>
<text x="360" y="255" font-size="17" font-weight="600" fill="#24424a" text-anchor="middle">x⁽ᵏ⁺¹⁾ = M⁻¹N x⁽ᵏ⁾ + M⁻¹b = G x⁽ᵏ⁾ + c</text>
<text x="34" y="286" font-size="13" fill="#607477">收敛当且仅当 ρ(G) &lt; 1；ρ 越小，每步衰减越快。</text>
</g></svg>